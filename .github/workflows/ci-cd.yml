name: CI/CD Pipeline

on:
    push:
        branches: [main, develop, release/**]
    pull_request:
        branches: [main, develop]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
        inputs:
            confirmed_local_tests:
                description: 'I confirm that I have run all integration tests locally and they passed'
                required: true
                type: boolean
                default: false

permissions:
    contents: read
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Use Node.js 20.x
              uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run linting
              run: npm run lint && npm run lint:md

    format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Use Node.js 20.x
              uses: actions/setup-node@v7
              with:
                  node-version: 20.x
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Run format check
              run: npm run format:check

    test:
        needs: [format, lint]
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [26.x]
        env:
            CI: true
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Build package
              run: npm run build
            - name: Run unit tests
              run: npm run test:unit
              env:
                  CI: true

    required:
        name: CI/CD Pipeline - Required
        runs-on: ubuntu-latest
        if: ${{ always() }}
        needs:
            - lint
            - format
            - test
        steps:
            - name: Verify required jobs
              shell: bash
              run: |
                  set -euo pipefail
                  RESULTS=(
                    "lint:${{ needs.lint.result }}"
                    "format:${{ needs.format.result }}"
                    "test:${{ needs.test.result }}"
                  )
                  echo "Job results:"
                  printf ' - %s\n' "${RESULTS[@]}"
                  FAIL=0
                  for r in "${RESULTS[@]}"; do
                    status="${r#*:}"
                    case "$status" in
                      success|skipped)
                        ;;
                      *)
                        echo "::error::Required job did not succeed: $r"
                        FAIL=1
                        ;;
                    esac
                  done
                  if [ "$FAIL" -ne 0 ]; then
                    exit 1
                  fi
